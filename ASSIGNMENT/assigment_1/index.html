<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Webpage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- STUDENT DETAILS -->
    <div class="quiz-container" id="studentSection">

        <h1>CSE DS A Quiz Challenge</h1>

        <p class="instructions">
            <strong>Instructions:</strong>
            Read each question carefully and select the best answer.
        </p>

        <div class="form-group">
            <label for="nameInput">Name:</label>
            <input type="text" id="nameInput" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="rollNoInput">Roll Number:</label>
            <input type="number" id="rollNoInput" placeholder="Enter your roll number">
        </div>

        <div class="form-group">
            <label>Section:</label>

            <div class="section-options">

                <input type="radio" name="section" value="A" id="sectionA">
                <label for="sectionA">A</label>

                <input type="radio" name="section" value="B" id="sectionB">
                <label for="sectionB">B</label>

                <input type="radio" name="section" value="C" id="sectionC">
                <label for="sectionC">C</label>

            </div>
        </div>

        <button id="startButton">Start Quiz</button>

    </div>

    <div class="quiz-container" id="quizSection" style="display: none;">

        <h1>CSE DS A Quiz</h1>

        <p id="questionNumber"></p>

        <div id="timer">
            Time Left: 10 seconds
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="nextButton">
            Next Question
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
