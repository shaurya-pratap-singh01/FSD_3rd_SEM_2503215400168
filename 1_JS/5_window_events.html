<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Event</title>
    <script>
        function openwindow(){
            window.open("","_blank","width=500,height=500");
        }
    </script>    
</head>
<body>
    <button onclick="openwindow()">Open Google</button>
    <button onclick="window.close()">Close Window</button>
</body>
</html>
